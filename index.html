    ctx.moveTo(-s * 0.088, -s * 0.755);                       // left shoulder
    ctx.quadraticCurveTo(s * 0.012, -s * 0.80, s * 0.098, -s * 0.745); // over the shoulder
    ctx.quadraticCurveTo(s * 0.115, -s * 0.60, s * 0.098, -s * 0.475); // down the side
    // skirt of the tunic, swaying with the stride
    ctx.quadraticCurveTo(s * 0.115 + nearThigh * s * 0.10, -s * 0.38, s * 0.078 + nearThigh * s * 0.055, -s * 0.275);
    ctx.lineTo(-s * 0.072 + nearThigh * s * 0.05, -s * 0.278);
    ctx.quadraticCurveTo(-s * 0.108, -s * 0.40, -s * 0.098, -s * 0.50);
    ctx.quadraticCurveTo(-s * 0.098, -s * 0.64, -s * 0.088, -s * 0.755);
    ctx.closePath();
    ctx.fill();

    // a fold down the front, and a hem shadow
    ctx.strokeStyle = 'rgba(0,0,0,.22)';
    ctx.lineWidth = Math.max(0.7, s * 0.010);
    ctx.beginPath();
    ctx.moveTo(s * 0.045, -s * 0.70);
    ctx.quadraticCurveTo(s * 0.062, -s * 0.48, s * 0.052 + nearThigh * s * 0.05, -s * 0.285);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,.26)';
    ctx.beginPath();
    ctx.moveTo(-s * 0.072 + nearThigh * s * 0.05, -s * 0.283);
    ctx.lineTo(s * 0.076 + nearThigh * s * 0.055, -s * 0.280);
    ctx.stroke();

    /* ── Belt ──────────────────────────────────────────────── */
    ctx.strokeStyle = 'rgba(150,110,52,.9)';
    ctx.lineWidth = Math.max(1.1, s * 0.026);
    ctx.beginPath();
    ctx.moveTo(-s * 0.092, -s * 0.500);
    ctx.lineTo(s * 0.098, -s * 0.492);
    ctx.stroke();
    ctx.fillStyle = 'rgba(232,196,124,.95)';
    ctx.beginPath();
    ctx.arc(s * 0.052, -s * 0.494, Math.max(0.8, s * 0.016), 0, Math.PI * 2);
    ctx.fill();

    /* ── Near leg, in front ─────────────────────────────────── */
    const nearJ = joints(nearThigh, nearKnee);
    drawLeg(nearJ, fig.robe, -0.06, 0);

    /* ── Neck and head in profile ───────────────────────────── */
    ctx.strokeStyle = fig.skin;
    ctx.lineWidth = s * 0.046;
    ctx.beginPath();
    ctx.moveTo(s * 0.006, -s * 0.765);
    ctx.lineTo(s * 0.014, -s * 0.805);
    ctx.stroke();

    const hx = s * 0.020;
    const hy = -s * 0.868;
    const hr = s * 0.081;

    // skull, with the jaw tapering toward the chin
    const sg = ctx.createRadialGradient(hx - hr * 0.3, hy - hr * 0.4, hr * 0.2, hx, hy, hr * 1.25);
    sg.addColorStop(0, shade(fig.skin, 0.16));
    sg.addColorStop(1, shade(fig.skin, -0.12));
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.moveTo(hx + hr * 0.30, hy - hr * 0.92);
    ctx.quadraticCurveTo(hx + hr * 1.02, hy - hr * 0.55, hx + hr * 0.96, hy + hr * 0.10);
    ctx.quadraticCurveTo(hx + hr * 0.80, hy + hr * 0.72, hx + hr * 0.22, hy + hr * 0.92); // chin
    ctx.quadraticCurveTo(hx - hr * 0.86, hy + hr * 0.86, hx - hr * 0.94, hy + hr * 0.02);
    ctx.quadraticCurveTo(hx - hr * 0.90, hy - hr * 0.78, hx + hr * 0.30, hy - hr * 0.92);
    ctx.closePath();
    ctx.fill();

    // Beard. Hangs from the jawline and below the chin. Anything drawn over the
    // middle of the face reads as a mask at this size, so the face stays clear.
    if (fig.beard) {
      const bg = ctx.createLinearGradient(0, hy + hr * 0.35, 0, hy + hr * 2.2);
      bg.addColorStop(0, 'rgba(112,102,86,.97)');
      bg.addColorStop(0.5, 'rgba(88,80,66,.97)');
      bg.addColorStop(1, 'rgba(58,52,42,.95)');
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.moveTo(hx - hr * 0.30, hy + hr * 0.62);          // behind the jaw
      ctx.quadraticCurveTo(hx + hr * 0.10, hy + hr * 0.50, hx + hr * 0.52, hy + hr * 0.74); // jawline
      ctx.quadraticCurveTo(hx + hr * 0.46, hy + hr * 1.30, hx + hr * 0.20, hy + hr * 2.10); // point
      ctx.quadraticCurveTo(hx - hr * 0.10, hy + hr * 1.40, hx - hr * 0.36, hy + hr * 0.92);
      ctx.closePath();
      ctx.fill();

      // moustache, a short bar under the nose
      ctx.beginPath();
      ctx.moveTo(hx + hr * 0.82, hy + hr * 0.26);
      ctx.quadraticCurveTo(hx + hr * 0.40, hy + hr * 0.24, hx + hr * 0.10, hy + hr * 0.46);
      ctx.quadraticCurveTo(hx + hr * 0.44, hy + hr * 0.54, hx + hr * 0.80, hy + hr * 0.44);
      ctx.closePath();
      ctx.fill();

      // strands
      ctx.strokeStyle = 'rgba(160,150,132,.30)';
      ctx.lineWidth = Math.max(0.4, s * 0.004);
      for (let i = 0; i < 3; i++) {
        const f = i / 2;
        ctx.beginPath();
        ctx.moveTo(hx + hr * (0.34 - f * 0.36), hy + hr * 0.86);
        ctx.quadraticCurveTo(hx + hr * (0.30 - f * 0.32), hy + hr * 1.40, hx + hr * (0.18 - f * 0.14), hy + hr * 1.94);
        ctx.stroke();
      }
    }

    // nose, small and drawn last so it sits on top of the beard
    ctx.fillStyle = shade(fig.skin, 0.06);
    ctx.beginPath();
    ctx.moveTo(hx + hr * 0.72, hy - hr * 0.22);
    ctx.quadraticCurveTo(hx + hr * 1.20, hy + hr * 0.10, hx + hr * 0.74, hy + hr * 0.30);
    ctx.closePath();
    ctx.fill();

    // brow shadow
    ctx.fillStyle = 'rgba(0,0,0,.13)';
    ctx.beginPath();
    ctx.ellipse(hx + hr * 0.46, hy - hr * 0.30, hr * 0.34, hr * 0.18, 0, 0, Math.PI * 2);
    ctx.fill();

    // hair: a close cap swept back from the brow
    const hg = ctx.createLinearGradient(hx - hr, hy - hr, hx + hr * 0.5, hy);
    hg.addColorStop(0, shade(fig.cloak, 0.12));
    hg.addColorStop(1, shade(fig.cloak, -0.20));
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.moveTo(hx + hr * 0.62, hy - hr * 0.52);              // hairline at the brow
    ctx.quadraticCurveTo(hx + hr * 0.24, hy - hr * 1.08, hx - hr * 0.50, hy - hr * 0.84);
    ctx.quadraticCurveTo(hx - hr * 1.06, hy - hr * 0.22, hx - hr * 0.90, hy + hr * 0.40);
    ctx.quadraticCurveTo(hx - hr * 0.80, hy - hr * 0.02, hx - hr * 0.64, hy - hr * 0.34);
    ctx.quadraticCurveTo(hx - hr * 0.24, hy - hr * 0.66, hx + hr * 0.62, hy - hr * 0.52);
    ctx.closePath();
    ctx.fill();

    /* ── Near arm, and the staff it carries ───────────────────── */
    // With a staff the arm is held out to the side, so the shaft stands clear of
    // the face instead of running up through it.
    const nearSwing = fig.staff
      ? 0.52 + (walking ? 0.06 * Math.sin(phase) : 0)
      : (walking ? 0.36 * Math.sin(phase) : 0.05);
    const nShX = s * 0.030;
    const nShY = -s * 0.732;
    const nElbowX = nShX + Math.sin(nearSwing) * upper;
    const nElbowY = nShY + Math.cos(nearSwing) * upper;
    const nHandAngle = nearSwing - (fig.staff ? 0.10 : 0.30);
    const nHandX = nElbowX + Math.sin(nHandAngle) * fore;
    const nHandY = nElbowY + Math.cos(nHandAngle) * fore;

    ctx.strokeStyle = shade(fig.robe, -0.12);
    ctx.lineWidth = s * 0.048;
    ctx.beginPath();
    ctx.moveTo(nShX, nShY);
    ctx.lineTo(nElbowX, nElbowY);
    ctx.lineTo(nHandX, nHandY);
    ctx.stroke();

    ctx.fillStyle = fig.skin;
    ctx.beginPath();
    ctx.arc(nHandX, nHandY, Math.max(1.0, s * 0.026), 0, Math.PI * 2);
    ctx.fill();

    if (fig.staff) {
      // the staff is planted ahead of the walker and tips with each stride
      const tilt = (walking ? 0.03 + Math.sin(phase) * 0.03 : 0.02);
      const bx = nHandX;
      const by = nHandY;
      const topX = bx + Math.sin(tilt) * s * 0.80;
      const topY = by - Math.cos(tilt) * s * 0.80;

      ctx.strokeStyle = '#6a5334';
      ctx.lineWidth = Math.max(1.2, s * 0.024);
      ctx.beginPath();
      ctx.moveTo(topX, topY);
      ctx.lineTo(bx, 0);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(180,150,96,.55)';
      ctx.lineWidth = Math.max(0.5, s * 0.007);
      ctx.beginPath();
      ctx.moveTo(topX + s * 0.006, topY);
      ctx.lineTo(bx + s * 0.006, 0);
      ctx.stroke();

      if (miracle > 0.05) {
        const gg = ctx.createRadialGradient(topX, topY, 0, topX, topY, s * 0.11);
        gg.addColorStop(0, 'rgba(248,224,166,' + (0.55 + miracle * 0.45) + ')');
        gg.addColorStop(1, 'rgba(248,224,166,0)');
        ctx.fillStyle = gg;
        ctx.beginPath();
        ctx.arc(topX, topY, s * 0.11, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.restore();
  }

  /* ═══════════════════════════════════════════════════════════════
     GATE — a curtain of light across the road ahead.

     It stands between the pilgrim and the destination, on the road, so it
     reads as the thing blocking the way. Once answered it dissolves.
     ═══════════════════════════════════════════════════════════════ */
  function drawGate(gate, passed, w, h, time) {
    if (passed) return;

    const pulse = 0.5 + Math.sin(time * 1.7) * 0.5;
    const x = w * Scenes.GATE_X;
    const bot = h * (Scenes.GROUND + 0.010);
    const rise = h * 0.26;
    const halfW = w * 0.15;

    // A bank of luminous mist standing across the road. Built from soft radial
    // blobs rather than lines or a rectangle, so it has no edge to read as an
    // object and no top line to read as a panel.
    ctx.save();
    for (let i = 0; i < 9; i++) {
      const f = i / 8;
      const bx = x + (f - 0.5) * halfW * 1.6;
      const edge = Math.max(0, 1 - Math.abs(f - 0.5) * 2.0);
      const by = bot - rise * (0.34 + Math.sin(f * 3.1 + time * 0.7) * 0.08);
      const r = halfW * (0.60 + Math.sin(f * 5.0) * 0.10);

      const g = ctx.createRadialGradient(bx, by, 0, bx, by, r);
      g.addColorStop(0, 'rgba(252,234,186,' + ((0.17 + pulse * 0.08) * edge).toFixed(3) + ')');
      g.addColorStop(0.5, 'rgba(248,224,164,' + ((0.09 + pulse * 0.05) * edge).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(244,212,146,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(bx, by, r, rise * 0.62, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // soft vertical shafts of light, fading out at both ends
    for (let i = -3; i <= 3; i++) {
      const fx = x + i * halfW * 0.30;
      const edge = 1 - Math.abs(i) / 4.2;
      const a = (0.07 + pulse * 0.05) * edge;
      const shaft = ctx.createLinearGradient(0, bot - rise, 0, bot);
      shaft.addColorStop(0, 'rgba(252,234,186,0)');
      shaft.addColorStop(0.45, 'rgba(252,234,186,' + (a * 0.7).toFixed(3) + ')');
      shaft.addColorStop(1, 'rgba(252,234,186,' + a.toFixed(3) + ')');
      ctx.strokeStyle = shaft;
      ctx.lineWidth = Math.max(2, w * 0.016);
      ctx.beginPath();
      ctx.moveTo(fx, bot - rise);
      ctx.lineTo(fx, bot);
      ctx.stroke();
    }
    ctx.restore();

    // the ground it stands on, lit from within
    const seam = ctx.createLinearGradient(x - halfW, 0, x + halfW, 0);
    seam.addColorStop(0, 'rgba(246,224,170,0)');
    seam.addColorStop(0.5, 'rgba(252,238,196,' + (0.42 + pulse * 0.26) + ')');
    seam.addColorStop(1, 'rgba(246,224,170,0)');
    ctx.strokeStyle = seam;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x - halfW, bot);
    ctx.quadraticCurveTo(x, bot - h * 0.006, x + halfW, bot);
    ctx.stroke();

    // a few slow motes rising out of it
    for (let i = 0; i < 6; i++) {
      const t = (time * 0.16 + i / 6) % 1;
      const mx = x + Math.sin(i * 2.4 + time * 0.5) * halfW * 0.8;
      const my = bot - rise * t;
      ctx.globalAlpha = (1 - t) * 0.5;
      ctx.fillStyle = '#f8e2b0';
      ctx.beginPath();
      ctx.arc(mx, my, 1.2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ═══════════════════════════════════════════════════════════════
     Particles
     ═══════════════════════════════════════════════════════════════ */
  function spawnDust(x, y, colour) {
    if (state.dust.length > 55) return;
    state.dust.push({
      x: x, y: y,
      vx: -0.22 - Math.random() * 0.6,
      vy: -0.12 - Math.random() * 0.4,
      life: 1,
      r: 1 + Math.random() * 2.2,
      colour: colour,
    });
  }

  function spawnSpark(x, y) {
    if (state.sparks.length > 70) return;
    state.sparks.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 1.5,
      vy: -0.65 - Math.random() * 1.6,
      life: 1,
      r: 0.9 + Math.random() * 1.7,
    });
  }

  function stepParticles(dt) {
    for (let i = state.dust.length - 1; i >= 0; i--) {
      const d = state.dust[i];
      d.x += d.vx * dt * 60;
      d.y += d.vy * dt * 60;
      d.vy += 0.006;
      d.life -= dt * 1.5;
      if (d.life <= 0) state.dust.splice(i, 1);
    }
    for (let i = state.sparks.length - 1; i >= 0; i--) {
      const s = state.sparks[i];
      s.x += s.vx * dt * 60;
      s.y += s.vy * dt * 60;
      s.vy += 0.016;
      s.life -= dt * 0.85;
      if (s.life <= 0) state.sparks.splice(i, 1);
    }
  }

  function drawParticles() {
    state.dust.forEach(function (d) {
      ctx.globalAlpha = Math.max(0, d.life) * 0.32;
      ctx.fillStyle = d.colour;
      ctx.beginPath();
      ctx.arc(d.x, d.y, Math.max(0.4, d.r * d.life), 0, Math.PI * 2);
      ctx.fill();
    });
    state.sparks.forEach(function (s) {
      ctx.globalAlpha = Math.max(0, s.life) * 0.9;
      ctx.fillStyle = '#f6d99a';
      ctx.fillRect(s.x, s.y, s.r, s.r);
    });
    ctx.globalAlpha = 1;
  }

  /* ═══════════════════════════════════════════════════════════════
     The frame
     ═══════════════════════════════════════════════════════════════ */
  function render(dt) {
    const w = state.w;
    const h = state.h;
    const stage = state.stage;
    if (!stage || !w || !h) return;

    state.time += dt;

    if (state.walking) {
      const before = state.progress;
      state.progress = Math.min(state.target, state.progress + dt * WALK_SPEED);

      if (state.progress > before) {
        // count real footsteps rather than frames, so the tally reads honestly
        state.stepAcc += (state.progress - before) * 42;
        while (state.stepAcc >= 1) {
          state.stepAcc -= 1;
          if (hooks.onStep) hooks.onStep();
        }
        const groundY = h * Scenes.GROUND;
        if (Math.random() < (state.progress - before) * 22) {
          spawnDust(w * Scenes.PILGRIM_X - 5 + Math.random() * 9, groundY - 1, stage.palette.land);
        }
      }

      if (state.progress >= state.target - 0.0005) {
        state.walking = false;
        if (hooks.onArrive) hooks.onArrive(state.progress);
      }
    }

    if (state.miracleActive) {
      state.miracle = Math.min(1, state.miracle + dt * 0.44);
      const groundY = h * Scenes.GROUND;
      for (let i = 0; i < 2; i++) {
        spawnSpark(w * (0.45 + Math.random() * 0.4), groundY - h * 0.12 * state.miracle);
      }
      if (state.miracle >= 1) {
        state.miracleActive = false;
        if (hooks.onMiracleDone) hooks.onMiracleDone();
      }
    }

    stepParticles(dt);

    ctx.clearRect(0, 0, w, h);
    Scenes.draw(ctx, w, h, stage, state.progress, state.miracle, state.time);

    const groundY = h * Scenes.GROUND;

    stage.gates.forEach(function (gate, i) {
      drawGate(gate, state.gatesPassed[i], w, h, state.time);
    });

    drawParticles();

    // Big enough to read the gait on a phone. At 0.14 the figure was a speck and
    // all the walk-cycle work was invisible.
    const scale = Math.min(w, h) * 0.23;
    const phase = state.time * (state.walking ? 7.4 : 0.75);
    drawPilgrim(w * Scenes.PILGRIM_X, groundY, scale, stage.figure, phase, state.walking, state.miracle);

    if (state.miracle > 0.02) {
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(
        w * Scenes.PILGRIM_X, groundY - scale * 0.6, 0,
        w * Scenes.PILGRIM_X, groundY - scale * 0.6, scale * 2.6
      );
      g.addColorStop(0, 'rgba(244,212,146,' + (0.14 * state.miracle) + ')');
      g.addColorStop(1, 'rgba(244,212,146,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  /* ── Loop ── */
  function loop(ts) {
    if (!last) last = ts;
    const dt = Math.min(0.05, (ts - last) / 1000);
    last = ts;
    if (!state.paused) render(dt);
    raf = requestAnimationFrame(loop);
  }

  /* ── Public ── */
  function init(h) {
    hooks = h || {};
    resize();
    state.reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', function () { setTimeout(resize, 160); });
    if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas.parentElement);
    cancelAnimationFrame(raf);
    last = 0;
    raf = requestAnimationFrame(loop);
  }

  function load(stage) {
    state.stage = stage;
    state.progress = 0;
    state.target = 0;
    state.walking = false;
    state.miracle = 0;
    state.miracleActive = false;
    state.gatesPassed = stage.gates.map(function () { return false; });
    state.dust = [];
    state.sparks = [];
    state.stepAcc = 0;
  }

  function walkTo(target) {
    state.target = clamp(target, 0, 1);
    if (state.target > state.progress) state.walking = true;
  }

  /* One Forward tap = one stride. The gate is reached after several of them, so
     the walk is something you do rather than a jump cut to the question. */
  function stride(limit) {
    const stop = clamp(limit, 0, 1);
    const next = Math.min(stop, state.progress + STRIDE);
    if (next > state.progress + 0.0005) {
      state.target = next;
      state.walking = true;
      return true;
    }
    return false;
  }

  function passGate(i) { state.gatesPassed[i] = true; }
  function miracle() { state.miracleActive = true; }
  function pause(on) { state.paused = on; }

  function reset() {
    state.progress = 0;
    state.target = 0;
    state.walking = false;
    state.miracle = 0;
    state.miracleActive = false;
    state.stepAcc = 0;
    if (state.stage) state.gatesPassed = state.stage.gates.map(function () { return false; });
  }

  function nextGate() {
    if (!state.stage) return null;
    for (let i = 0; i < state.stage.gates.length; i++) {
      if (!state.gatesPassed[i]) return state.stage.gates[i];
    }
    return null;
  }

  return {
    init: init, load: load, walkTo: walkTo, stride: stride, passGate: passGate,
    miracle: miracle, reset: reset, pause: pause, nextGate: nextGate,
    get progress() { return state.progress; },
    get walking() { return state.walking; },
    get miracleLevel() { return state.miracle; },
  };
})();

/* ---------- bible.js ---------- */
/* ═══════════════════════════════════════════════════════════════════
   BIBLE — the full King James text, one book file at a time.
   The index is tiny; a book only downloads when it is opened, so the
   app starts instantly and the reader still holds all 31,102 verses.
   ═══════════════════════════════════════════════════════════════════ */

const Bible = (function () {
  let index = null;
  const cache = {};
  let current = { book: null, chapter: 1 };
  let pending = null;

  const OT_COUNT = 39;

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  async function loadIndex() {
    if (index) return index;
    const res = await fetch('kjv/index.json');
    if (!res.ok) throw new Error('bible index ' + res.status);
    index = await res.json();
    return index;
  }

  async function loadBook(slug) {
    if (cache[slug]) return cache[slug];
    if (pending && pending[slug]) return pending[slug];
    pending = pending || {};
    pending[slug] = fetch('kjv/' + slug + '.json')
      .then((r) => {
        if (!r.ok) throw new Error('book ' + slug + ' ' + r.status);
        return r.json();
      })
      .then((d) => {
        cache[slug] = d;
        return d;
      })
      .finally(() => { delete pending[slug]; });
    return pending[slug];
  }

  function findBook(name) {
    if (!index) return null;
    const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, '');
    const target = norm(name);
    return index.find((b) => norm(b.n) === target) || null;
  }

  /* ── Render the book chooser ── */
  function renderBooks(container, onPick) {
    container.innerHTML = '';
    const grid = el('div', 'book-grid');
    index.forEach((b) => {
      const btn = el('button', 'book-btn', b.n);
      if (current.book === b.n) btn.classList.add('on');
      btn.addEventListener('click', () => onPick(b));
      grid.appendChild(btn);
    });
    container.appendChild(grid);
  }

  function renderChapters(container, book, onPick) {
    container.innerHTML = '';
    const count = Object.keys(book.c).length;
    const grid = el('div', 'chap-grid');
    Object.keys(book.c)
      .map(Number)
      .sort((a, b) => a - b)
      .forEach((n) => {
        const btn = el('button', 'chap-btn', String(n));
        if (current.book === book.n && current.chapter === n) btn.classList.add('on');
        btn.addEventListener('click', () => onPick(n));
        grid.appendChild(btn);
      });
    container.appendChild(grid);
    if (count > 0) {
      const note = el('p', 'note', 'King James Version. Tap a chapter number to read.');
      container.appendChild(note);
    }
  }

  function renderPassage(container, book, chapter, highlightVerse) {
    container.innerHTML = '';
    const verses = book.c[String(chapter)] || [];
    if (!verses.length) {
      container.appendChild(el('p', 'note', 'No text for this chapter in the local library.'));
      return;
    }

    const head = el('div', 'reading-head');
    head.appendChild(el('h3', null, book.n + ' ' + chapter));
    head.appendChild(el('span', null, 'KJV'));
    container.appendChild(head);

    verses.forEach((text, i) => {
      const row = el('div', 'verse');
      row.dataset.v = String(i + 1);
      row.appendChild(el('span', 'verse-n', String(i + 1)));
      row.appendChild(el('span', 'verse-text', text));
      if (highlightVerse && i + 1 === highlightVerse) {
        row.classList.add('hit');
        row.id = 'verse-' + (i + 1);
      }
      container.appendChild(row);
    });

    const nav = el('div', 'reader-nav');
    const nums = Object.keys(book.c).map(Number).sort((a, b) => a - b);
    const pos = nums.indexOf(chapter);
    const prev = el('button', null, '‹ ' + (pos > 0 ? 'Chapter ' + nums[pos - 1] : 'Start'));
    prev.disabled = pos <= 0;
    const next = el('button', null, (pos < nums.length - 1 ? 'Chapter ' + nums[pos + 1] : 'End') + ' ›');
    next.disabled = pos >= nums.length - 1;
    nav.appendChild(prev);
    nav.appendChild(next);
    container.appendChild(nav);

    container._nav = { book, nums, pos };
    return { prev, next, nums, pos };
  }

  return {
    loadIndex,
    loadBook,
    findBook,
    renderBooks,
    renderChapters,
    renderPassage,
    get current() { return current; },
    set current(v) { current = v; },
    get index() { return index; },
  };
})();

/* ---------- ui.js ---------- */
/* ═══════════════════════════════════════════════════════════════════
   UI — state machine, question flow, drawers, persistence.
   One rule holds the whole game together: you cannot walk past a gate
   you have not answered. Gates are checked on arrival, not on tap.
   ═══════════════════════════════════════════════════════════════════ */

const UI = (function () {
  const $ = (id) => document.getElementById(id);

  const SAVE_KEY = 'path-of-prophets-v1';

  const app = {
    stageIndex: 0,
    gateIndex: 0,          // which gate is currently in play
    solved: [],            // per-stage array of booleans
    streak: 0,
    steps: 0,
    sound: true,
    busy: false,           // true while a card is up or walking
    complete: false,
    lastSlot: -1,          // slot the right answer used last, so it can move
  };

  let bible = { tab: 'read', view: 'chapters', book: null, chapter: 1, highlight: 0 };

  /* ═══════════════════════════════════════════════════════════════
     Persistence
     ═══════════════════════════════════════════════════════════════ */
  function save() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        stageIndex: app.stageIndex,
        solved: app.solved,
        streak: app.streak,
        steps: app.steps,
        sound: app.sound,
      }));
    } catch (e) { /* private mode, storage full — play on */ }
  }

  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      if (typeof d.stageIndex === 'number') app.stageIndex = Scenes.clamp(d.stageIndex, 0, STAGES.length - 1);
      if (Array.isArray(d.solved)) app.solved = d.solved;
      if (typeof d.streak === 'number') app.streak = d.streak;
      if (typeof d.steps === 'number') app.steps = d.steps;
      if (typeof d.sound === 'boolean') app.sound = d.sound;
    } catch (e) { /* start fresh */ }
  }

  function solvedFor(i) {
    if (!app.solved) app.solved = STAGES.map(() => []);
    if (!app.solved[i]) app.solved[i] = [];
    return app.solved[i];
  }

  function stageDone(i) {
    const s = solvedFor(i);
    return STAGES[i].gates.every((_, g) => s[g]);
  }

  function firstStageUndone() {
    for (let i = 0; i < STAGES.length; i++) if (!stageDone(i)) return i;
    return 0;
  }

  /* ═══════════════════════════════════════════════════════════════
     Toast
     ═══════════════════════════════════════════════════════════════ */
  let toastTimer = 0;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
  }

  /* ═══════════════════════════════════════════════════════════════
     HUD
     ═══════════════════════════════════════════════════════════════ */
  function paintHud() {
    const stage = STAGES[app.stageIndex];
    $('stage-num').textContent = stage.numeral;
    $('stage-name').textContent = stage.name;
    $('stage-sub').textContent = stage.place;
    appEl.dataset.stage = stage.id;

    // path track
    const nodes = $('track-nodes');
    nodes.innerHTML = '';
    STAGES.forEach((s, i) => {
      const n = document.createElement('div');
      n.className = 'track-node';
      if (stageDone(i)) n.classList.add('done');
      else if (i === app.stageIndex) n.classList.add('now');
      n.title = s.name;
      nodes.appendChild(n);
    });

    const done = STAGES.filter((_, i) => stageDone(i)).length;
    const solvedNow = solvedFor(app.stageIndex).filter(Boolean).length;
    const within = solvedNow / stage.gates.length;
    const pct = ((done + (stageDone(app.stageIndex) ? 0 : within)) / STAGES.length) * 100;
    $('track-fill').style.width = Scenes.clamp(pct, 2, 100) + '%';

    // streak
    $('streak-count').textContent = String(app.streak);
    $('streak').classList.toggle('hot', app.streak >= 3);

    // steps
    $('steps-count').textContent = String(app.steps);

    // sound
    $('sound-btn').setAttribute('aria-pressed', String(app.sound));
  }

  function caption(text, keep) {
    const c = $('caption');
    const t = $('caption-text');
    if (!text) {
      c.classList.add('gone');
      return;
    }
    t.innerHTML = text;
    c.classList.remove('gone');
    if (!keep) {
      clearTimeout(caption._t);
      caption._t = setTimeout(() => c.classList.add('gone'), 4200);
    }
  }

  /* ═══════════════════════════════════════════════════════════════
     Stage loading
     ═══════════════════════════════════════════════════════════════ */
  function enterStage(i, opts) {
    const options = opts || {};
    app.stageIndex = i;
    app.complete = false;
    app.busy = false;
    app.gateIndex = 0;

    const stage = STAGES[i];
    Engine.load(stage);
    Engine.pause(false);
    Audio.bed(stage.scene);

    // resume a stage that was partly solved
    const solved = solvedFor(i);
    let furthest = 0;
    solved.forEach((ok, g) => {
      if (ok) {
        Engine.passGate(g);
        furthest = Math.max(furthest, stage.gates[g].at);
      }
    });

    if (options.fresh) {
      app.solved[i] = [];
      Engine.reset();
      furthest = 0;
    } else if (furthest > 0) {
      Engine.walkTo(furthest);
    }

    paintHud();
    closeAll();
    hideCard('question');
    hideCard('complete');

    if (stageDone(i) && !options.replay) {
      Engine.walkTo(1);
      Engine.miracle();
      app.complete = true;
      caption('This journey is already walked. Tap Forward to walk it again.', true);
      setTimeout(() => showComplete(true), 1400);
    } else {
      caption(stage.intro);
    }
  }

  /* ═══════════════════════════════════════════════════════════════
     Forward
     ═══════════════════════════════════════════════════════════════ */
  function forwardTarget() {
    const stage = STAGES[app.stageIndex];
    const solved = solvedFor(app.stageIndex);
    for (let g = 0; g < stage.gates.length; g++) {
      if (!solved[g]) return { at: stage.gates[g].at, gate: g };
    }
    return { at: 1, gate: null };
  }

  function step() {
    if (app.busy || app.complete) return;
    const stage = STAGES[app.stageIndex];
    const { at, gate } = forwardTarget();

    // mid-stride: let the current one finish before taking another
    if (Engine.walking) return;

    if (Engine.progress >= at - 0.005) {
      // standing at the gate: open it
      if (gate != null) openQuestion(gate);
      else finishStage();
      return;
    }

    // one tap, one stride toward the gate
    Engine.stride(at);
    Audio.resume();
    if (Engine.progress < 0.06) caption(stage.approach);
  }

  /* ═══════════════════════════════════════════════════════════════
     Question card
     ═══════════════════════════════════════════════════════════════ */
  function showCard(which) {
    $('question-overlay').hidden = which !== 'question';
    $('complete-overlay').hidden = which !== 'complete';
  }
  function hideCard(which) {
    if (which === 'question') $('question-overlay').hidden = true;
    if (which === 'complete') $('complete-overlay').hidden = true;
  }

  /* ═══════════════════════════════════════════════════════════════
     Option order

     The right answer is stored as an index into the authored list, which
     would otherwise always sit in the first slot. Shuffle the display order
     every time the card opens, and keep the answer out of the slot it used
     last, so tapping A out of habit never works twice running.
     ═══════════════════════════════════════════════════════════════ */
  function shuffleOptions(gate) {
    const n = gate.options.length;
    const order = gate.options.map(function (_, i) { return i; });

    for (let i = n - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = order[i];
      order[i] = order[j];
      order[j] = t;
    }

    // if the answer landed in the same slot as the previous question, move it
    if (n > 1 && order.indexOf(gate.correct) === app.lastSlot) {
      const from = order.indexOf(gate.correct);
      const to = (from + 1 + Math.floor(Math.random() * (n - 1))) % n;
      const t = order[to];
      order[to] = order[from];
      order[from] = t;
    }

    app.lastSlot = order.indexOf(gate.correct);
    return order;
  }

  function openQuestion(gateIndex) {
    const stage = STAGES[app.stageIndex];
    const gate = stage.gates[gateIndex];
    if (!gate) return;

    app.busy = true;
    app.gateIndex = gateIndex;
    Engine.pause(true);

    $('q-ref').textContent = stage.ref + ' · ' + gate.label;
    $('q-prompt').textContent = gate.prompt;

    const opts = $('q-options');
    opts.innerHTML = '';
    const letters = ['A', 'B', 'C', 'D'];
    const order = shuffleOptions(gate);
    app.order = order;

    order.forEach((source, slot) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.type = 'button';
      btn.dataset.pick = String(source);
      btn.style.animationDelay = (slot * 55) + 'ms';
      const key = document.createElement('span');
      key.className = 'opt-key';
      key.textContent = letters[slot];
      const label = document.createElement('span');
      label.className = 'opt-text';
      label.textContent = gate.options[source];
      btn.appendChild(key);
      btn.appendChild(label);
      btn.addEventListener('click', () => answer(source, gate, btn));
      opts.appendChild(btn);
    });

    $('q-feedback').hidden = true;
    $('q-feedback').className = 'feedback';
    $('q-foot').hidden = true;

    showCard('question');
    $('q-prompt').scrollIntoView({ block: 'nearest' });
  }

  function answer(pick, gate, btn) {
    if (app.busy === 'resolved') return;

    const opts = $('q-options');
    const buttons = Array.from(opts.querySelectorAll('.opt'));

    if (pick === gate.correct) {
      app.busy = 'resolved';
      buttons.forEach((b) => {
        b.disabled = true;
        if (Number(b.dataset.pick) === gate.correct) b.classList.add('right');
        else b.classList.add('faded');
      });

      const firstTry = !btn.dataset.retried;
      if (firstTry) {
        app.streak += 1;
        app.steps += 0;
      }
      Audio.chime();
      haptic([12, 40, 18]);

      const fb = $('q-feedback');
      fb.className = 'feedback';
      fb.hidden = false;
      $('q-feedback-text').innerHTML =
        'The way opens. <em>' + gate.verse + '</em> — tap to read it in the Bible.';
      $('q-verse-btn').onclick = () => openVerse(gate.verse);

      $('q-foot').hidden = false;
      $('q-next-btn').textContent = 'Walk on';
      $('q-next-btn').onclick = () => resolveGate(gate, app.gateIndex);
      $('q-retry-btn').hidden = true;

      paintHud();
      save();
    } else {
      btn.classList.add('wrong');
      btn.dataset.retried = '1';
      app.streak = 0;
      Audio.thud();
      haptic([18, 30, 18]);

      const fb = $('q-feedback');
      fb.className = 'feedback bad';
      fb.hidden = false;
      $('q-feedback-text').innerHTML = gate.wrong;
      $('q-verse-btn').onclick = () => openVerse(gate.verse);
      paintHud();
      save();
    }
  }

  function resolveGate(gate, gateIndex) {
    hideCard('question');
    Engine.passGate(gateIndex);
    Engine.pause(false);
    Audio.rumble();
    haptic([10, 26, 10]);

    const solved = solvedFor(app.stageIndex);
    solved[gateIndex] = true;
    save();
    paintHud();

    const stage = STAGES[app.stageIndex];
    const allSolved = stage.gates.every((_, i) => solved[i]);

    app.busy = false;

    if (allSolved) {
      caption(stage.miracle, true);
      setTimeout(() => {
        Engine.walkTo(1);
        Engine.miracle();
      }, 420);
    } else {
      caption('The way is open. Walk on.');
    }
  }

  /* ═══════════════════════════════════════════════════════════════
     Completion
     ═══════════════════════════════════════════════════════════════ */
  function finishStage() {
    if (app.complete) return;
    app.complete = true;
    app.busy = true;
    Engine.pause(true);
    Audio.chime();
    haptic([14, 50, 14, 50, 24]);
    paintHud();
    save();
    setTimeout(() => showComplete(false), 700);
  }

  function showComplete(already) {
    const stage = STAGES[app.stageIndex];
    $('c-title').textContent = already ? 'Already walked' : stage.doneTitle;
    $('c-summary').textContent = stage.doneSummary;

    const verseText = VERSES[stage.doneVerse] || '';
    const q = $('c-verse');
    q.innerHTML = '';
    q.appendChild(document.createTextNode('“' + verseText + '”'));
    const cite = document.createElement('cite');
    cite.textContent = stage.doneVerse;
    q.appendChild(cite);

    const last = app.stageIndex === STAGES.length - 1;
    $('c-next-btn').textContent = last ? 'Walk the first again' : 'Next prophet';

    showCard('complete');
  }

  function nextStage() {
    hideCard('complete');
    Engine.pause(false);
    app.busy = false;
    app.complete = false;

    const last = app.stageIndex === STAGES.length - 1;
    const next = last ? firstStageUndone() : (app.stageIndex + 1) % STAGES.length;
    enterStage(next);
  }

  function replayStage() {
    hideCard('complete');
    Engine.pause(false);
    app.solved[app.stageIndex] = [];
    app.busy = false;
    app.complete = false;
    save();
    enterStage(app.stageIndex, { fresh: true });
    caption('Walking again from the start.');
  }

  /* ═══════════════════════════════════════════════════════════════
     Stages drawer
     ═══════════════════════════════════════════════════════════════ */
  function openStages() {
    const list = $('stages-list');
    list.innerHTML = '';

    STAGES.forEach((s, i) => {
      const row = document.createElement('button');
      row.className = 'stage-row';
      if (i === app.stageIndex) row.classList.add('current');
      if (stageDone(i)) row.classList.add('done');

      const seal = document.createElement('span');
      seal.className = 'row-seal';
      seal.textContent = s.numeral;

      const body = document.createElement('span');
      body.className = 'row-body';
      const nm = document.createElement('span');
      nm.className = 'row-name';
      nm.textContent = s.name;
      const pl = document.createElement('span');
      pl.className = 'row-place';
      pl.textContent = s.place;
      const rf = document.createElement('span');
      rf.className = 'row-ref';
      rf.textContent = s.ref;
      body.appendChild(nm);
      body.appendChild(pl);
      body.appendChild(rf);

      row.appendChild(seal);
      row.appendChild(body);

      if (stageDone(i)) {
        const mark = document.createElement('span');
        mark.className = 'row-mark';
        mark.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>';
        row.appendChild(mark);
      }

      row.addEventListener('click', () => {
        closeSheet('stages-overlay');
        if (i !== app.stageIndex) enterStage(i);
      });

      list.appendChild(row);
    });

    openSheet('stages-overlay');
  }

  /* ═══════════════════════════════════════════════════════════════
     Bible drawer
     ═══════════════════════════════════════════════════════════════ */
  async function openBible(verseRef) {
    openSheet('bible-overlay');
    setTab('read');

    try {
      await Bible.loadIndex();
    } catch (e) {
      $('bible-read').innerHTML = '<p class="note">The Bible library could not be loaded.</p>';
      return;
    }

    if (verseRef) {
      // "Exodus 14:16" -> book "Exodus", chapter 14, verse 16
      const m = verseRef.match(/^(.+?)\s+(\d+):(\d+)$/);
      if (m) {
        const found = Bible.findBook(m[1]);
        if (found) {
          bible.book = found;
          bible.chapter = Number(m[2]);
          bible.highlight = Number(m[3]);
          bible.view = 'reading';
          renderBible();
          return;
        }
      }
    }

    bible.view = 'chapters';
    renderBible();
  }

  function setTab(tab) {
    bible.tab = tab;
    $('tab-read').classList.toggle('is-on', tab === 'read');
    $('tab-themes').classList.toggle('is-on', tab === 'themes');
    $('tab-read').setAttribute('aria-selected', String(tab === 'read'));
    $('tab-themes').setAttribute('aria-selected', String(tab === 'themes'));
    $('bible-read').hidden = tab !== 'read';
    $('bible-themes').hidden = tab !== 'themes';
    if (tab === 'themes') renderThemes();
  }

  async function renderBible() {
    const host = $('bible-read');
    if (bible.view === 'books') {
      Bible.renderBooks(host, async (b) => {
        bible.book = b;
        bible.view = 'chapters';
        // the index holds a chapter COUNT, so open the first chapter of the text
        try {
          const data = await Bible.loadBook(b.s);
          bible.chapter = Number(Object.keys(data.c).map(Number).sort((x, y) => x - y)[0]);
        } catch (e) {
          bible.chapter = 1;
        }
        renderBible();
      });
      return;
    }

    if (!bible.book) {
      bible.view = 'books';
      return renderBible();
    }

    // make sure the book text is loaded
    host.innerHTML = '<p class="note">Loading scripture…</p>';
    let data;
    try {
      data = await Bible.loadBook(bible.book.s);
    } catch (e) {
      host.innerHTML = '<p class="note">That book could not be loaded. Check your connection and try again.</p>';
      return;
    }

    if (bible.view === 'chapters') {
      Bible.current = { book: data.n, chapter: bible.chapter };
      Bible.renderChapters(host, data, (ch) => {
        bible.chapter = ch;
        bible.view = 'reading';
        renderBible();
      });
      return;
    }

    const hl = bible.highlight;
    bible.highlight = 0;
    Bible.current = { book: data.n, chapter: bible.chapter };
    const nav = Bible.renderPassage(host, data, bible.chapter, hl);

    nav.prev.addEventListener('click', () => {
      bible.chapter = nav.nums[nav.pos - 1];
      renderBible();
    });
    nav.next.addEventListener('click', () => {
      bible.chapter = nav.nums[nav.pos + 1];
      renderBible();
    });

    if (hl) {
      const target = host.querySelector('.verse.hit');
      if (target) setTimeout(() => target.scrollIntoView({ block: 'center', behavior: 'smooth' }), 60);
    } else {
      host.scrollTop = 0;
    }

    // a way back out to the book list
    const back = document.createElement('button');
    back.className = 'link-btn';
    back.style.marginTop = '12px';
    back.textContent = '‹ All books';
    back.addEventListener('click', () => {
      bible.view = 'books';
      renderBible();
    });
    host.appendChild(back);
  }

  const THEME_ICONS = {
    rest: '<svg viewBox="0 0 24 24"><path d="M12 3v18M8 8h8"/><circle cx="12" cy="17" r="2"/></svg>',
    temple: '<svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V9l7-5 7 5v12M10 21v-6h4v6"/></svg>',
    cloud: '<svg viewBox="0 0 24 24"><path d="M6 17h11a4 4 0 000-8 6 6 0 00-11.6 1.8A3.2 3.2 0 006 17z"/></svg>',
    angel: '<svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="3"/><path d="M12 10v11M7 21l5-6 5 6M6 8l-2-4M18 8l2-4"/></svg>',
    sword: '<svg viewBox="0 0 24 24"><path d="M18 3l3 3-9 9-3-3zM9 15l-5 5M6 12l6 6"/></svg>',
    heart: '<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.6-7-9.4A4 4 0 0112 8a4 4 0 017 2.6C19 15.4 12 20 12 20z"/></svg>',
    scroll: '<svg viewBox="0 0 24 24"><path d="M6 4h11a2 2 0 012 2v12a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2z"/><path d="M8 9h7M8 13h7"/></svg>',
    water: '<svg viewBox="0 0 24 24"><path d="M12 3s6 6.4 6 10.4A6 6 0 016 13.4C6 9.4 12 3 12 3z"/></svg>',
  };

  function renderThemes() {
    const host = $('bible-themes');
    host.innerHTML = '';

    const intro = document.createElement('p');
    intro.className = 'note';
    intro.style.margin = '0 0 12px';
    intro.style.paddingTop = '0';
    intro.style.borderTop = '0';
    intro.textContent = 'Short summaries of themes Seventh-day Adventists read through the whole Bible. Every reference opens the King James text.';
    host.appendChild(intro);

    THEMES.forEach((theme) => {
      const d = document.createElement('details');
      d.className = 'theme';

      const sum = document.createElement('summary');
      const icon = document.createElement('span');
      icon.innerHTML = THEME_ICONS[theme.icon] || THEME_ICONS.scroll;
      icon.style.display = 'contents';
      sum.appendChild(icon);
      sum.appendChild(document.createTextNode(theme.title));
      d.appendChild(sum);

      const body = document.createElement('div');
      body.className = 'theme-body';
      theme.body.forEach((para) => {
        const p = document.createElement('p');
        p.textContent = para;
        body.appendChild(p);
      });

      const refs = document.createElement('div');
      refs.className = 'refs';
      theme.refs.forEach((ref) => {
        const chip = document.createElement('button');
        chip.className = 'ref-chip';
        chip.textContent = ref;
        chip.addEventListener('click', () => openVerse(ref));
        refs.appendChild(chip);
      });
      body.appendChild(refs);
      d.appendChild(body);

      host.appendChild(d);
    });

    const note = document.createElement('p');
    note.className = 'note';
    note.textContent = 'Scripture quoted is the King James Version. Theme summaries are original writing, not quotations from any church publication.';
    host.appendChild(note);
  }

  function openVerse(ref) {
    closeSheet('bible-overlay');
    // reopen straight into the passage
    bible = { tab: 'read', view: 'reading', book: null, chapter: 1, highlight: 0 };
    openBible(ref);
  }

  /* ═══════════════════════════════════════════════════════════════
     Sheets
     ═══════════════════════════════════════════════════════════════ */
  function openSheet(id) {
    $(id).hidden = false;
    Engine.pause(true);
  }

  function closeSheet(id) {
    $(id).hidden = true;
    if ($('question-overlay').hidden && $('complete-overlay').hidden) {
      Engine.pause(false);
    }
  }

  function closeAll() {
    ['stages-overlay', 'bible-overlay'].forEach((id) => { $(id).hidden = true; });
  }

  /* ═══════════════════════════════════════════════════════════════
     Wiring
     ═══════════════════════════════════════════════════════════════ */
  let appEl = null;

  function haptic(pattern) {
    if (navigator.vibrate) {
      try { navigator.vibrate(pattern); } catch (e) { /* not supported */ }
    }
  }

  function bind() {
    $('forward-btn').addEventListener('click', step);

    // hold-to-walk: repeated steps while the button is held
    const fwd = $('forward-btn');
    let holdTimer = 0;
    let holdInterval = 0;
    const startHold = () => {
      fwd.classList.add('is-down');
      holdTimer = setTimeout(() => {
        holdInterval = setInterval(step, 340);
      }, 460);
    };
    const endHold = () => {
      fwd.classList.remove('is-down');
      clearTimeout(holdTimer);
      clearInterval(holdInterval);
    };
    fwd.addEventListener('pointerdown', startHold);
    ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => fwd.addEventListener(ev, endHold));

    // keyboard
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D' || e.key === ' ') {
        const anyOpen = !$('question-overlay').hidden || !$('complete-overlay').hidden;
        if (anyOpen) return;
        e.preventDefault();
        step();
      }
      if (e.key === 'Escape') closeAll();
    });

    $('stage-btn').addEventListener('click', openStages);
    $('stages-close').addEventListener('click', () => closeSheet('stages-overlay'));
    $('stages-overlay').addEventListener('click', (e) => {
      if (e.target === $('stages-overlay')) closeSheet('stages-overlay');
    });

    $('bible-btn').addEventListener('click', () => openBible());
    $('bible-close').addEventListener('click', () => closeSheet('bible-overlay'));
    $('bible-overlay').addEventListener('click', (e) => {
      if (e.target === $('bible-overlay')) closeSheet('bible-overlay');
    });

    $('tab-read').addEventListener('click', () => setTab('read'));
    $('tab-themes').addEventListener('click', () => setTab('themes'));

    $('sound-btn').addEventListener('click', () => {
      app.sound = !app.sound;
      Audio.setEnabled(app.sound);
      if (app.sound) {
        Audio.resume();
        Audio.bed(STAGES[app.stageIndex].scene);
      } else {
        Audio.stopBed();
      }
      paintHud();
      save();
    });

    $('c-next-btn').addEventListener('click', nextStage);
    $('c-replay-btn').addEventListener('click', replayStage);

    // question card dismissal is not allowed by tapping the scrim:
    // the gate has to be answered.
    $('question-overlay').addEventListener('click', (e) => {
      if (e.target === $('question-overlay')) {
        toast('Answer the question to open the way.');
      }
    });
  }

  /* ═══════════════════════════════════════════════════════════════
     Boot
     ═══════════════════════════════════════════════════════════════ */
  function start() {
    appEl = $('app');
    load();
    if (!app.solved) app.solved = STAGES.map(() => []);

    Audio.setEnabled(app.sound);

    Engine.init({
      onStep: () => {
        app.steps += 1;
        if (app.steps % 2 === 0) Audio.step();
        if (app.steps % 3 === 0) paintHud();
      },
      onArrive: (progress) => {
        const { gate } = forwardTarget();
        if (gate != null && Engine.progress >= STAGES[app.stageIndex].gates[gate].at - 0.006) {
          openQuestion(gate);
        }
      },
      onMiracleDone: () => {
        setTimeout(() => finishStage(), 500);
      },
    });

    bind();
    paintHud();

    // begin at the furthest unfinished stage
    enterStage(app.stageIndex, { resume: true });

    // first gesture unlocks audio
    const unlock = () => {
      Audio.resume();
      if (app.sound) Audio.bed(STAGES[app.stageIndex].scene);
      window.removeEventListener('pointerdown', unlock);
      window.removeEventListener('keydown', unlock);
    };
    window.addEventListener('pointerdown', unlock);
    window.addEventListener('keydown', unlock);

    // visibility: pause the loop when hidden
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) Engine.pause(true);
      else if ($('question-overlay').hidden && $('complete-overlay').hidden) Engine.pause(false);
    });
  }

  return { start, toast };
})();

/* ---------- boot.js ---------- */
/* ═══════════════════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════════════════ */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => UI.start());
} else {
  UI.start();
}
})();</script>
