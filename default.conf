# Static site for Holy Walk.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The shell must always be revalidated so a deploy is picked up, but the
    # icons are content-addressed by filename and safe to cache for a year.
    add_header Cache-Control "no-cache" always;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # The KJV book files are JSON and compress about 4:1.
    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    location / {
        try_files $uri $uri/ =404;
    }
}
