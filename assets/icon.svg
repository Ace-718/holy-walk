<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="sky" cx="50%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#233651"/>
      <stop offset="44%" stop-color="#101a2b"/>
      <stop offset="100%" stop-color="#04060b"/>
    </radialGradient>
    <linearGradient id="feather" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#fff6de"/>
      <stop offset="38%" stop-color="#f2d494"/>
      <stop offset="100%" stop-color="#b2862f"/>
    </linearGradient>
    <linearGradient id="featherIn" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#dcae55"/>
      <stop offset="100%" stop-color="#6d4d17"/>
    </linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e6"/>
      <stop offset="40%" stop-color="#f0d79f"/>
      <stop offset="100%" stop-color="#bf953c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffeec4" stop-opacity=".50"/>
      <stop offset="58%" stop-color="#f0cd7d" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#f0cd7d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloFill" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#f6d894" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#f6d894" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#sky)"/>
  <circle cx="256" cy="232" r="200" fill="url(#glow)"/>
  <g opacity=".92">
    <path d="M 0 -41.0 C -31.8 -50.9 -81.6 -32.8 -113.4 0 C -81.6 32.8 -31.8 50.9 0 41.0 Z" transform="translate(242 268) rotate(4.0)" fill="url(#featherIn)"/>
    <path d="M 0 -37.0 C -40.2 -45.9 -103.3 -29.6 -143.4 0 C -103.3 29.6 -40.2 45.9 0 37.0 Z" transform="translate(242 268) rotate(27.3)" fill="url(#featherIn)"/>
    <path d="M 0 -33.1 C -45.9 -41.0 -118.0 -26.4 -163.9 0 C -118.0 26.4 -45.9 41.0 0 33.1 Z" transform="translate(242 268) rotate(48.1)" fill="url(#featherIn)"/>
    <path d="M 0 -29.1 C -50.9 -36.0 -130.9 -23.3 -181.8 0 C -130.9 23.3 -50.9 36.0 0 29.1 Z" transform="translate(242 268) rotate(68.0)" fill="url(#featherIn)"/>
    <path d="M 0 -41.0 C -31.8 -50.9 -81.6 -32.8 -113.4 0 C -81.6 32.8 -31.8 50.9 0 41.0 Z" transform="translate(270 268) scale(-1 1) rotate(4.0)" fill="url(#featherIn)"/>
    <path d="M 0 -37.0 C -40.2 -45.9 -103.3 -29.6 -143.4 0 C -103.3 29.6 -40.2 45.9 0 37.0 Z" transform="translate(270 268) scale(-1 1) rotate(27.3)" fill="url(#featherIn)"/>
    <path d="M 0 -33.1 C -45.9 -41.0 -118.0 -26.4 -163.9 0 C -118.0 26.4 -45.9 41.0 0 33.1 Z" transform="translate(270 268) scale(-1 1) rotate(48.1)" fill="url(#featherIn)"/>
    <path d="M 0 -29.1 C -50.9 -36.0 -130.9 -23.3 -181.8 0 C -130.9 23.3 -50.9 36.0 0 29.1 Z" transform="translate(270 268) scale(-1 1) rotate(68.0)" fill="url(#featherIn)"/>
  </g>
  <g>
    <path d="M 0 -45.6 C -35.3 -56.5 -90.7 -36.5 -126.0 0 C -90.7 36.5 -35.3 56.5 0 45.6 Z" transform="translate(252 252) rotate(4.0)" fill="url(#feather)"/>
    <path d="M 0 -41.2 C -44.6 -51.0 -114.7 -32.9 -159.3 0 C -114.7 32.9 -44.6 51.0 0 41.2 Z" transform="translate(252 252) rotate(27.3)" fill="url(#feather)"/>
    <path d="M 0 -36.7 C -51.0 -45.5 -131.1 -29.4 -182.1 0 C -131.1 29.4 -51.0 45.5 0 36.7 Z" transform="translate(252 252) rotate(48.1)" fill="url(#feather)"/>
    <path d="M 0 -32.3 C -56.6 -40.1 -145.4 -25.8 -202.0 0 C -145.4 25.8 -56.6 40.1 0 32.3 Z" transform="translate(252 252) rotate(68.0)" fill="url(#feather)"/>
    <path d="M 0 -45.6 C -35.3 -56.5 -90.7 -36.5 -126.0 0 C -90.7 36.5 -35.3 56.5 0 45.6 Z" transform="translate(260 252) scale(-1 1) rotate(4.0)" fill="url(#feather)"/>
    <path d="M 0 -41.2 C -44.6 -51.0 -114.7 -32.9 -159.3 0 C -114.7 32.9 -44.6 51.0 0 41.2 Z" transform="translate(260 252) scale(-1 1) rotate(27.3)" fill="url(#feather)"/>
    <path d="M 0 -36.7 C -51.0 -45.5 -131.1 -29.4 -182.1 0 C -131.1 29.4 -51.0 45.5 0 36.7 Z" transform="translate(260 252) scale(-1 1) rotate(48.1)" fill="url(#feather)"/>
    <path d="M 0 -32.3 C -56.6 -40.1 -145.4 -25.8 -202.0 0 C -145.4 25.8 -56.6 40.1 0 32.3 Z" transform="translate(260 252) scale(-1 1) rotate(68.0)" fill="url(#feather)"/>
  </g>
  <!-- Halo: a ring behind the head, so a rim of gold shows all round it. Drawn before
       the head, never above it — a ring floating clear of the head reads as a visor. -->
  <circle cx="256" cy="164" r="74" fill="url(#haloFill)"/>
  <!-- dark gap, then the ring: without it the gold ring dissolves into the gold wings -->
  <circle cx="256" cy="164" r="54" fill="none" stroke="#080d16" stroke-width="39"/>
  <circle cx="256" cy="164" r="54" fill="none" stroke="#e8c884" stroke-width="21"/>
  <circle cx="256" cy="164" r="54" fill="none" stroke="#fff6da" stroke-width="8.0" opacity=".95"/>
  <!-- head: smaller than the halo's inner edge, so a full ring of gold shows round it -->
  <circle cx="256" cy="164" r="27" fill="url(#robe)"/>
  <!-- robe -->
  <!-- arms, held slightly out and down, ending in simple hands -->
  <path d="M212 232 C196 254 190 288 192 318 C204 322 216 314 220 300 C224 276 224 252 222 236 Z" fill="url(#robe)"/>
  <path d="M300 232 C316 254 322 288 320 318 C308 322 296 314 292 300 C288 276 288 252 290 236 Z" fill="url(#robe)"/>
  <!-- the robe: shoulders, then a bell to the hem -->
  <path d="M256 192 C228 192 210 208 206 232 L190 344
           C196 372 316 372 322 344 L306 232 C302 208 284 192 256 192 Z"
        fill="url(#robe)"/>
  <!-- shoulder yoke -->
  <path d="M230 198 Q256 214 282 198" fill="none" stroke="#b98c37" stroke-width="5" opacity=".38"/>
  <!-- folds -->
  <path d="M256 210 V362" stroke="#a87c2c" stroke-width="4.5" opacity=".22" stroke-linecap="round"/>
  <path d="M228 224 L216 358" stroke="#a87c2c" stroke-width="4" opacity=".16" stroke-linecap="round"/>
  <path d="M284 224 L296 358" stroke="#a87c2c" stroke-width="4" opacity=".16" stroke-linecap="round"/>
  <!-- hem -->
  <path d="M190 344 C196 372 316 372 322 344" fill="none" stroke="#fff4d4" stroke-width="6" opacity=".8" stroke-linecap="round"/>
  <!-- stars -->
  <g fill="#ffeec4">
    <circle cx="92" cy="92" r="5" opacity=".9"/>
    <circle cx="422" cy="104" r="4" opacity=".75"/>
    <circle cx="126" cy="410" r="3.6" opacity=".6"/>
    <circle cx="392" cy="398" r="4.6" opacity=".8"/>
    <circle cx="256" cy="470" r="3.8" opacity=".6"/>
    <circle cx="64" cy="252" r="3" opacity=".4"/>
    <circle cx="452" cy="264" r="3" opacity=".4"/>
  </g>
</svg>